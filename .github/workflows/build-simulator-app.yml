name: Build / Simulator App

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App"
        required: true
        default: "Bitwarden"
        type: choice
        options:
          - Bitwarden
          - Authenticator
  pull_request:
    paths:
      - Scripts/build-simulator-app.sh
      - .github/workflows/build-simulator-app.yml

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.app || 'Bitwarden' }} (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      _APP: ${{ inputs.app || 'Bitwarden' }}
      MINT_PATH: .mint/lib
      MINT_LINK_PATH: .mint/bin
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Xcode version
        run: echo "_XCODE_VERSION=$(tr -d '\n' < .xcode-version)" >> "$GITHUB_ENV"

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env._XCODE_VERSION }}

      - name: Install Homebrew dependencies
        run: brew bundle

      - name: Cache Mint packages
        id: mint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mint
          key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-

      - name: Install Mint packages
        if: steps.mint-cache.outputs.cache-hit != 'true'
        run: mint bootstrap

      - name: Build simulator app
        run: ./Scripts/build-simulator-app.sh --app "$_APP"

      - name: Upload simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/${{ env._APP }}-Simulator.zip
          archive: false
          if-no-files-found: error
